[metadata]
name = meeting-memory
version = 0.1.0
description = Create, search, and digest durable memory from meeting notes
long_description = file: README.md
long_description_content_type = text/markdown
license = Proprietary

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.8

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    meeting-memory = meeting_memory.knowledge.cli:main
