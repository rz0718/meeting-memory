[metadata]
name = meeting-memory
version = 0.1.0
description = Create, search, and digest durable memory from meeting and Slack sources
long_description = file: README.md
long_description_content_type = text/markdown
license = Proprietary

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.8
include_package_data = True
install_requires =
    PyYAML>=6.0

[options.packages.find]
where = src

[options.package_data]
meeting_memory.ui =
    static/*.html
    static/*.css
    static/js/*.js

[options.extras_require]
ui =
    fastapi>=0.100
    uvicorn>=0.20

[options.entry_points]
console_scripts =
    meeting-memory = meeting_memory.knowledge.cli:main
